<style>
:root{
  --bg:#EFF3F9; --surface:#FFFFFF; --ink:#0B1F3F; --muted:#55647D; --line:#D7DEEA;
  --brand:#012768; --brand-ink:#FFFFFF; --deep:#012768; --accent:#FE4E9A; --cta:#FE4E9A; --cta-ink:#012768; --danger:#C62F1B; --ok:#137A4F; --warn:#9A6400;
  --chip-ok:#DDF3E8; --chip-bad:#FBE1DC; --chip-warn:#FCEFCF;
  --f-head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --surface:#111F36; --ink:#E8EEF9; --muted:#95A5C0; --line:#22375A; --brand:#8DB3F5; --brand-ink:#06142E; --deep:#012768;
  --chip-ok:#153C2C; --chip-bad:#4A1E18; --chip-warn:#3F3013; --danger:#FF7B66; --ok:#5ED0A0; --warn:#F2B84B;}}
:root[data-theme="dark"]{
  --bg:#0A1424; --surface:#111F36; --ink:#E8EEF9; --muted:#95A5C0; --line:#22375A; --brand:#8DB3F5; --brand-ink:#06142E; --deep:#012768;
  --chip-ok:#153C2C; --chip-bad:#4A1E18; --chip-warn:#3F3013; --danger:#FF7B66; --ok:#5ED0A0; --warn:#F2B84B;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-head);line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800} h2{font-size:1.6rem;font-weight:800} h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 1em} a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.narrow{max-width:640px;margin:0 auto;padding:0 18px}
header.top{background:#fff;color:#012768;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);border-bottom:3px solid #FE4E9A}
/* F-14 (rapport, 9 oct. 2026) : .wrap avait une hauteur FIXE (height:72px) alors que .nav
   pouvait passer sur 2 lignes (flex-wrap) dès que plusieurs commandes étaient visibles
   (sélecteur de langue + lien + menu tableau de bord + déconnexion) — sur un écran Android
   étroit, la 2e ligne était coupée/invisible au lieu de repousser la hauteur du bandeau.
   On passe en min-height + padding vertical : le bandeau grandit proprement quand ça wrap. */
header.top .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;min-height:72px;padding-top:9px;padding-bottom:9px}
.logo{display:flex;align-items:center;text-decoration:none;flex:0 0 auto}
.logo img{height:54px;width:auto;display:block}
header.top nav{margin-inline-start:auto;display:flex;align-items:center;gap:2px 4px;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
header.top nav a,header.top nav button{color:#012768;text-decoration:none;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap;line-height:1.25}
header.top nav a:hover,header.top nav button:hover{background:rgba(11,50,115,.09)}
/* Hiérarchie visuelle des commandes : l'action principale (connexion / tableau de bord) est
   un bouton plein, clairement la plus visible ; la déconnexion est un bouton "ghost" contouré
   pour qu'on ne la confonde pas avec un simple lien de navigation. */
header.top nav .navcta{background:var(--cta);color:var(--cta-ink);border-radius:999px;padding:9px 18px}
header.top nav .navcta:hover{background:var(--cta);filter:brightness(.94)}
header.top nav .navghost{border:1.5px solid rgba(1,39,104,.28);border-radius:999px;padding:7.5px 16px}
header.top nav .navghost:hover{background:rgba(11,50,115,.06)}
@media(max-width:640px){
  header.top nav{width:100%;justify-content:flex-end;gap:2px}
  header.top nav a,header.top nav button{padding:8px 10px;font-size:.86rem}
  header.top nav .navcta{padding:8px 16px}
  header.top nav .navghost{padding:6.5px 14px}
}
@media(max-width:380px){
  header.top .wrap{gap:6px 10px}
  header.top nav a,header.top nav button{padding:7px 8px;font-size:.8rem}
  header.top nav .navcta{padding:7px 13px}
}
main{padding:28px 0 60px;min-height:70vh}

.scan{position:relative;z-index:1}
.backbar{padding:0 0 14px}
.backbtn{background:none;border:0;color:var(--brand);font-weight:600;font-size:.95rem;cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.backbtn:hover{text-decoration:underline}
footer.foot{background:#012768;color:#C9D6F0;border-top:4px solid #FE4E9A;padding:44px 0 22px;font-size:.92rem}
footer.foot .fg{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:30px}
@media(max-width:860px){footer.foot .fg{grid-template-columns:1fr 1fr}}
@media(max-width:520px){footer.foot .fg{grid-template-columns:1fr}}
footer.foot h4{color:#fff;font:700 1rem var(--f-head);margin:0 0 10px}
footer.foot a{color:#C9D6F0;text-decoration:none;display:block;padding:4px 0;cursor:pointer}
footer.foot a:hover{color:#FF7FB6;text-decoration:underline}
footer.foot .lchip{background:#fff;border-radius:12px;padding:8px 12px;display:inline-block;margin-bottom:12px}
footer.foot .lchip img{height:48px;display:block}
footer.foot p{margin:0 0 8px}
footer.foot .bot{border-top:1px solid rgba(255,255,255,.16);margin-top:28px;padding-top:16px;font-size:.8rem;color:#9FB2D6}
footer.foot .bot a{display:inline;padding:0;color:#9FB2D6}
main.home{padding:0}
/* ---------- Accueil ---------- */
.btn.big{padding:15px 26px;font-size:1.05rem;border-radius:12px} .btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)} .btn.ghost:hover{background:rgba(255,255,255,.12)}
.hm-hero{background:radial-gradient(900px 480px at 82% 30%,#1B4DA8 0%,rgba(27,88,176,0) 65%),linear-gradient(180deg,#012768,#021A4A);color:#fff;padding:54px 0 70px;overflow:hidden;position:relative}
.hm-hero:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.4px);background-size:26px 26px;pointer-events:none}
.hm-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;position:relative;z-index:1}
@media(max-width:900px){.hm-grid{grid-template-columns:1fr}.hm-hero{padding:36px 0 54px}}
.hm-eyebrow{display:inline-block;background:rgba(254,78,154,.16);color:#FFB3D3;border:1px solid rgba(254,78,154,.5);border-radius:99px;padding:5px 14px;font-size:.82rem;font-weight:600;margin-bottom:18px}
.hm-hero h1{color:#fff;font-size:clamp(2.1rem,5.2vw,3.7rem);margin-bottom:.45em}
.hm-hero h1 em{font-style:normal;color:#FF7FB6}
.hm-lead{font-size:1.15rem;line-height:1.6;color:#D3DFF5;max-width:33em;margin-bottom:26px}
.hm-trust{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:10px 22px;color:#C4D3EF;font-size:.92rem}
.hm-trust li:before{content:"✓";color:#FF7FB6;font-weight:800;margin-right:8px}
.hm-cardzone{position:relative;display:flex;flex-direction:column;align-items:center;padding:20px 0}
.hm-ring{position:absolute;width:112%;height:74%;top:12%;left:-6%;border:16px solid #FE4E9A;border-radius:50%;transform:rotate(-14deg);opacity:.9;clip-path:polygon(0 0,100% 0,100% 55%,0 55%);pointer-events:none}
.flipwrap{--k:1.4;width:calc(85.6mm*var(--k));height:calc(53.98mm*var(--k));perspective:1600px;cursor:pointer;position:relative;z-index:2;animation:floaty 6s ease-in-out infinite;outline-offset:8px}
@media(max-width:1100px){.flipwrap{--k:1.2}}
@media(max-width:520px){.flipwrap{--k:.95}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media(prefers-reduced-motion:reduce){.flipwrap{animation:none}.flipin{transition:none!important}}
.flipin{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flipwrap.back .flipin{transform:rotateY(180deg)}
.flipwrap .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipwrap .face.fb{transform:rotateY(180deg)}
.flipwrap .cw{width:100%;height:100%;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.flipwrap .idc{transform:scale(calc(.377953*var(--k)))}
.hm-flipbtns{display:flex;gap:8px;margin-top:26px;position:relative;z-index:2}
.hm-flipbtns button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:7px 18px;cursor:pointer;font-weight:600}
.hm-flipbtns button.on{background:#FE4E9A;color:#012768;border-color:#FE4E9A}
.hm-hint{margin:10px 0 0;font-size:.82rem;color:#A9BCE0;position:relative;z-index:2}
.hm-sec{padding:64px 0}.hm-sec.alt{background:var(--surface)}
.hm-sec h2{font-size:clamp(1.6rem,3.6vw,2.3rem);text-align:center;margin-bottom:.3em}
.hm-sub{text-align:center;color:var(--muted);max-width:40em;margin:0 auto 38px}
.hm-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.hm-step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;position:relative}
.hm-sec.alt .hm-step{background:var(--bg)}
.hm-step i{font-style:normal;width:42px;height:42px;border-radius:50%;background:#FE4E9A;color:#012768;display:flex;align-items:center;justify-content:center;font:800 1.2rem var(--f-head);margin-bottom:14px}
.hm-step h3{margin-bottom:.35em}.hm-step p{margin:0;color:var(--muted);font-size:.95rem}
.hm-scan{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
@media(max-width:820px){.hm-scan{grid-template-columns:1fr}}
.hm-scan h2{text-align:left}
.hm-list{list-style:none;padding:0;margin:0 0 22px}
.hm-list li{display:flex;gap:12px;margin-bottom:14px;font-size:1.02rem}
.hm-list li:before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:#FE4E9A;margin-top:8px}
.phone{width:290px;height:580px;border-radius:40px;border:11px solid #0B1F3F;overflow:hidden;background:#fff;margin:0 auto;box-shadow:0 26px 50px rgba(11,31,63,.28);position:relative;pointer-events:none}
.phone .in{width:440px;transform:scale(.62);transform-origin:0 0}
.phone .scan{min-height:0;box-shadow:none;max-width:none;width:440px}
.phone:after{content:"";position:absolute;left:50%;top:6px;width:80px;height:6px;border-radius:9px;background:#0B1F3F;transform:translateX(-50%)}
.hm-ben{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.hm-b{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px}

const BASE_CURRENCY='XAF';
const CURRENCY_TABLE={
 XAF:{symbol:'FCFA',name:'Franc CFA (CEMAC)',decimals:0,rate:1,fmt:(v)=>Math.round(v).toLocaleString('fr-FR')+' FCFA'},
 XOF:{symbol:'FCFA',name:'Franc CFA (UEMOA)',decimals:0,rate:1,fmt:(v)=>Math.round(v).toLocaleString('fr-FR')+' FCFA'},

/* pays -> devise. CEMAC (XAF) et UEMOA (XOF) par défaut car marché initial IFRIQI. */
const XOF_ZONE=['BJ','BF','CI','GW','ML','NE','SN','TG'];
const CUSTOM_CCY={GH:'GHS',NG:'NGN',KE:'KES',EG:'EGP',MA:'MA'==='MA'?'MAD':'XAF',ZA:'ZAR',TZ:'TZS',UG:'UGX'};
const CurrencyService={
 BASE_CURRENCY,
 getCurrencyByCountry(countryCode){const c=String(countryCode||'').toUpperCase();if(CUSTOM_CCY[c])return CUSTOM_CCY[c];if(XOF_ZONE.includes(c))return 'XOF';return 'XAF'},
 getExchangeRate(currency){const c=CURRENCY_TABLE[currency]||CURRENCY_TABLE[BASE_CURRENCY];return c.rate},
 convertAmount(amountBase,currency){const r=this.getExchangeRate(currency);return amountBase*r},
 formatLocalAmount(amountBase,currency){const c=CURRENCY_TABLE[currency]||CURRENCY_TABLE[BASE_CURRENCY];return c.fmt(this.convertAmount(amountBase,currency))},
};
/* Affichage « prix/commission dans la devise de l'utilisateur », avec repli FCFA si pays inconnu.
   Les enregistrements historiques (commandes, commissions) figent devise+taux au moment de leur création :
   on ne recalcule jamais une commission passée avec un taux plus récent. */
function moneyFor(amountBase,countryCode){const cur=CurrencyService.getCurrencyByCountry(countryCode);if(cur===BASE_CURRENCY)return money(amountBase);return `${money(amountBase)} (≈ ${CurrencyService.formatLocalAmount(amountBase,cur)})`}
function localAmt(rec){ // rec: commande ou commission avec .currency/.rateUsed/.amount déjà figés
  if(!rec||!rec.currency||rec.currency===BASE_CURRENCY)return money(rec?rec.amount:0);
  const c=CURRENCY_TABLE[rec.currency]||CURRENCY_TABLE[BASE_CURRENCY];
  return `${money(rec.amount)} (≈ ${c.fmt(rec.amount*(rec.rateUsed||c.rate))})`}

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function rndToken(){const a=new Uint8Array(24);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function newPublicId(){db.counter=(db.counter||0)+1;const d=new Date();return 'IFR-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+'-'+String(db.counter).padStart(6,'0')}

function load(){try{const r=localStorage.getItem(KEY)||localStorage.getItem('ifricard_db_v1')||localStorage.getItem(OLDKEY);if(r)return JSON.parse(r)}catch(e){}return mem||blank()}
let db=load();ensureDb();
function save(){mem=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function audit(actor,action,res,meta){db.audit.push({t:Date.now(),actor,action,res:res||'',meta:meta||''});save()}
const me=()=>db.users.find(u=>u.id===db.session)||null;
const getP=id=>db.profiles.find(p=>p.id===id);
const myProfiles=()=>db.profiles.filter(p=>p.userId===db.session);
function cardStatus(p){const c=p.card;if(!c)return null;if(c.status==='DEACTIVATED')return 'DEACTIVATED';return 'ACTIVE'}
const credits=p=>p.card&&p.card.credits!==undefined?p.card.credits:EDITS;
const dataSig=p=>JSON.stringify([p.first,p.last,p.dob,p.sex,p.address,p.photo,p.printContact,p.printHealth,p.contacts,p.health]);
const STAT={ACTIVE:['Active','ok'],EXPIRED:['Expirée','warn'],DEACTIVATED:['Désactivée','bad']};
const chip=s=>`<span class="chip ${STAT[s][1]}">${STAT[s][0]}</span>`;
const age=d=>{if(!d)return null;const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
function baseUrl(){return location.href.split('#')[0]}
function scanUrl(token){return baseUrl()+'#/i/'+token}
function qrSvg(url){if(typeof qrcode==='undefined')return '<div style="font-size:6pt;color:#000">QR indisponible</div>';const q=qrcode(0,'M');q.addData(url);q.make();return q.createSvgTag(4,0).replace(/ width="[^"]*"/,'').replace(/ height="[^"]*"/,'')}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3600)}
function openModal(h,wide){$('#layer').innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><div class="modal${wide?' wide':''}">${h}</div></div>`}
function closeModal(){$('#layer').innerHTML=''}
let _cb=null;
function ask(msg,fn,label){_cb=fn;openModal(`<p>${msg}</p><div class="row"><button class="btn danger" onclick="closeModal();_cb&&_cb()">${label||t('g_confirm')}</button><button class="btn sec" onclick="closeModal()">${t('g_cancel')}</button></div>`)}
function go(p){location.hash='#'+p}

t",adm_th_message:"Message",adm_gw_title:"Moyens de paiement proposés",adm_gw_desc:"Activez les moyens offerts par la passerelle retenue. Au moins un moyen doit rester actif.",adm_gw_note:"Prototype : les paiements sont simulés. En production, cette liste reflète les capacités de la passerelle (Mobile Money, cartes, PayPal, etc.).",adm_tab_overview:"Aperçu",adm_tab_distributors:"Distributeurs",adm_tab_sales:"Ventes",adm_tab_commissions:"Commissions",adm_tab_withdrawals:"Retraits",adm_tab_params:"Paramètres",adm_tab_users:"Utilisateurs",adm_tab_cards:"Cartes",adm_tab_payments:"Paiements",adm_tab_scans:"Scans",adm_tab_log:"Journal",adm_tab_support:"Support",adm_tab_gateway:"Paiement",adm_backoffice_title:"Back-office",adm_exit_btn:"Quitter",adm_confirm_reset:"Effacer TOUTES les données de la démo ?",adm_reset_btn:"Tout effacer",adm_min_payment_toast:"Au moins un moyen de paiement doit rester actif.",legal_privacy_h1:"Politique de confidentialité",legal_privacy_notice:"Texte de travail à faire valider par un juriste dans chaque pays de lancement (données de santé, mineurs, transferts internationaux). Exemple au Cameroun : loi n°2024/017 du 23 décembre 2024 sur la protection des données personnelles.",legal_privacy_data_title:"Données collectées",legal_privacy_data_body:"Identité, date de naissance, photo, contacts d'urgence et, si vous le souhaitez, informations de santé essentielles. Nous ne collectons rien d'autre.",legal_privacy_why_title:"Pourquoi",legal_privacy_why_body:"Uniquement pour produire votre carte et afficher, en cas d'urgence, les informations que vous avez autorisées.",legal_privacy_scan_title:"Ce que voit la personne qui scanne",legal_privacy_scan_body:"Votre photo, votre nom, l'identifiant de la carte, les informations de santé marquées « visibles » et vos contacts d'urgence. Une carte désactivée n'affiche rien.",legal_privacy_qr_title:"Le QR code",legal_privacy_qr_body:"Il ne contient aucune donnée personnelle, seulement une clé aléatoire non devinable, révocable à tout moment.",legal_privacy_rights_title:"Vos droits",legal_privacy_rights_body:"Modifier vos données, désactiver votre carte ou supprimer votre compte depuis « Mon espace ». Contact : via la page Aide.",legal_privacy_retention_title:"Conservation",legal_privacy_retention_body:"Pendant toute la vie de votre carte, puis suppression sur demande.",contact_h1:"Contact",contact_lead:"Une question sur votre carte, un paiement ou votre compte ? Écrivez-nous par e-mail ou sur WhatsApp : nous répondons généralement sous 24 à 48 heures ouvrées.",contact_email_title:"Par e-mail",contact_email_desc:"Pour toute question détaillée ou avec pièce jointe.",contact_wa_title:"Par WhatsApp",contact_wa_desc:"Pour une réponse rapide, du lundi au samedi.",contact_write_title:"Nous écrire directement",contact_subject_label:"Sujet",contact_opt_payment:"Problème de paiement",contact_opt_card:"Problème de carte",contact_opt_qr:"Problème de QR",contact_opt_data:"Modification de données",contact_opt_account:"Perte de compte",contact_opt_refund:"Remboursement",contact_opt_technical:"Problème technique",contact_opt_other:"Autre",contact_phone_email_label:"Votre téléphone ou email",contact_message_label:"Message",contact_send_btn:"Envoyer",contact_footer_note:"Vous pouvez aussi consulter notre <a href=\"#/aide\">page d'aide</a> ou nos <a href=\"#/conditions\">conditions d'utilisation</a>.",contact_err_missing:"Indiquez un contact et un message.",contact_sent_toast:"Message envoyé. Nous vous répondrons rapidement.",legal_terms_h1:"Conditions d'utilisation",legal_terms_notice:"Texte de travail à faire valider par un juriste dans chaque pays de lancement avant tout usage commercial.",legal_terms_s1_title:"1. Objet",legal_terms_s1_body:"IFRIQI est un service privé, non médical et non officiel, permettant de créer une carte personnelle d'identification et d'urgence associée à un QR code. En créant un compte ou en achetant une carte, vous acceptez les présentes conditions.",legal_terms_s2_title:"2. Ce qu'IFRIQI n'est pas",legal_terms_s2_body:"IFRIQI n'est ni une pièce d'identité officielle, ni un dossier médical, ni un service d'urgence, ni un service de diagnostic. Les informations affichées après un scan sont déclarées par le titulaire ou son représentant légal et ne remplacent pas une évaluation médicale.",legal_terms_s3_title:"3. Compte et exactitude des informations",legal_terms_s3_body:"Vous êtes responsable de l'exactitude des informations renseignées (identité, contacts, informations de santé) et de leur mise à jour. Un profil enfant ne peut être créé que par un parent ou représentant légal.",legal_terms_s4_title:"4. Carte et modifications",legal_terms_s4_body:"La carte IFRIQI n'a pas de date d'expiration. Le paiement inclut un nombre limité de modifications de vos informations (4 par défaut). Au-delà, un nouveau pack de modifications doit être acheté pour continuer à modifier votre profil ; la carte reste active et fonctionnelle entre-temps.",legal_terms_s5_title:"5. Paiement",legal_terms_s5_body:"Le paiement s'effectue via Mobile Money, carte bancaire, PayPal ou tout autre moyen proposé selon la passerelle disponible dans votre pays. La carte n'est activée qu'après confirmation du paiement par le prestataire.",legal_terms_s6_title:"6. Politique de remboursement",legal_terms_refund_1:"<b>Délai de rétractation.</b> Vous pouvez demander le remboursement intégral de votre carte dans un délai de 7 jours calendaires après l'achat, à condition que le QR code n'ait pas déjà été scanné ni la carte imprimée et utilisée.",legal_terms_refund_2:"<b>Erreur de paiement ou double débit.</b> Tout double paiement, débit sans création de carte, ou erreur technique imputable à IFRIQI ou à sa passerelle de paiement est remboursé intégralement, sans délai de rétractation, dès vérification.",legal_terms_refund_3:"<b>Après le délai de 7 jours.</b> Passé ce délai, ou si la carte a déjà été activement utilisée (impression, scan), la carte n'est plus remboursable, mais reste utilisable sans limite de durée.",legal_terms_refund_4:"<b>Packs de modifications.</b> Un pack de modifications non consommé peut être remboursé dans les 7 jours suivant son achat ; un pack déjà partiellement utilisé n'est pas remboursable.",legal_terms_refund_5:"<b>Comment demander un remboursement.</b> Contactez-nous via la page <a href=\"#/contact\">Contact</a> (e-mail ou WhatsApp) en indiquant la référence de votre paiement. Le remboursement est réalisé sur le même moyen de paiement que celui utilisé pour l'achat, sous 5 à 10 jours ouvrés selon la passerelle.",legal_terms_refund_6:"<b>Commissions du programme de recommandation.</b> Une commission liée à une commande remboursée est annulée conformément aux règles du programme de recommandation.",legal_terms_s7_title:"7. Désactivation et suppression",legal_terms_s7_body:"Vous pouvez désactiver votre carte ou supprimer votre compte à tout moment depuis « Mon espace ». La suppression du compte entraîne la suppression des données associées, sous réserve des obligations légales de conservation.",legal_terms_s8_title:"8. Programme de recommandation",legal_terms_s8_body:"Devenir distributeur est gratuit et facultatif. Les commissions ne sont dues que sur des ventes directes, réellement payées, effectuées via le lien commercial du distributeur, selon les règles détaillées sur la page « Recommander la carte ».",legal_terms_s9_title:"9. Responsabilité",legal_terms_s9_body:"IFRIQI met tout en œuvre pour assurer la disponibilité du service, sans garantir un fonctionnement ininterrompu (réseau, hébergement, passerelle de paiement). IFRIQI ne saurait être tenu responsable d'une décision médicale ou d'urgence prise sur la base des informations affichées par un tiers.",legal_terms_s10_title:"10. Modification des conditions",legal_terms_s10_body:"Ces conditions peuvent être mises à jour ; la version en vigueur est celle publiée sur cette page. Contact : <a href=\"#/contact\">page Contact</a>.",help_h1:"Aide et contact",help_faq_title:"Questions fréquentes",help_q1:"Faut-il une application pour scanner ?",help_a1:"Non. L'appareil photo de n'importe quel smartphone suffit.",help_q2:"J'ai perdu ma carte.",help_a2:"Dans « Mon espace », désactivez la carte ou générez un nouveau QR code : l'ancien cesse de fonctionner. Ces deux actions ne consomment aucune modification.",help_q3:"Puis-je modifier mes informations sans réimprimer ?",help_a3:"Oui, sauf photo, nom ou contact imprimé : dans ce cas, une nouvelle carte est proposée.",help_q4:"Quels moyens de paiement ?",help_a4:"Mobile Money, carte bancaire, PayPal et autres moyens, selon la passerelle de paiement disponible dans votre pays.",help_q5:"Ma carte expire-t-elle ?",help_a5:"Non. Le paiement inclut 4 modifications de vos informations. Une fois utilisées, la carte continue de fonctionner ; pour modifier à nouveau, vous payez un nouveau pack de 4 modifications.",help_q6:"La carte remplace-t-elle ma pièce d'identité ?",help_a6:"Non, c'est un service privé complémentaire.",help_write_title:"Nous écrire",pwd_title:"Changer mon mot de passe",pwd_current_label:"Mot de passe actuel",pwd_new_label:"Nouveau mot de passe",pwd_new_placeholder:"6 caractères minimum",pwd_confirm_label:"Confirmer le nouveau mot de passe",pwd_save_btn:"Enregistrer",pwd_err_missing:"Renseignez les trois champs.",pwd_err_wrong_current:"Le mot de passe actuel est incorrect.",pwd_err_too_short:"Le nouveau mot de passe doit contenir au moins 6 caractères.",pwd_err_mismatch:"Les deux nouveaux mots de passe ne correspondent pas.",pwd_err_same:"Le nouveau mot de passe doit être différent de l'ancien.",pwd_changed_toast:"Mot de passe modifié.",auth_err_pw_short:"Le mot de passe doit contenir au moins 6 caractères.",auth_err_name:"Renseignez votre prénom et votre nom.",auth_err_country:"Choisissez votre pays.",auth_err_dial:"Choisissez l'indicatif téléphonique.",auth_err_phone:"Entrez un numéro de téléphone valide (sans l'indicatif).",auth_err_email:"Entrez une adresse e-mail valide.",auth_err_duplicate:"Ce téléphone ou cet e-mail est déjà utilisé. Utilisez « Connexion ».",auth_err_id_required:"Entrez votre téléphone ou votre e-mail.",auth_err_bad_login:"Identifiant ou mot de passe incorrect.",auth_err_suspended:"Ce compte est suspendu. Contactez le support.",auth_forgot_toast:"Démo : en production, un code OTP est envoyé par SMS ou email.",g_no_data:"Aucune donnée pour le moment."},

message:"Message",adm_gw_title:"Payment methods offered",adm_gw_desc:"Enable the methods offered by the chosen gateway. At least one method must stay active.",adm_gw_note:"Prototype: payments are simulated. In production, this list reflects the gateway's capabilities (Mobile Money, cards, PayPal, etc.).",adm_tab_overview:"Overview",adm_tab_distributors:"Distributors",adm_tab_sales:"Sales",adm_tab_commissions:"Commissions",adm_tab_withdrawals:"Withdrawals",adm_tab_params:"Settings",adm_tab_users:"Users",adm_tab_cards:"Cards",adm_tab_payments:"Payments",adm_tab_scans:"Scans",adm_tab_log:"Log",adm_tab_support:"Support",adm_tab_gateway:"Payment",adm_backoffice_title:"Back office",adm_exit_btn:"Exit",adm_confirm_reset:"Erase ALL demo data?",adm_reset_btn:"Erase everything",adm_min_payment_toast:"At least one payment method must stay active.",legal_privacy_h1:"Privacy policy",legal_privacy_notice:"Working text to be validated by a lawyer in each launch country (health data, minors, international transfers). Example in Cameroon: law n°2024/017 of 23 December 2024 on the protection of personal data.",legal_privacy_data_title:"Data collected",legal_privacy_data_body:"Identity, date of birth, photo, emergency contacts and, if you wish, essential health information. We collect nothing else.",legal_privacy_why_title:"Why",legal_privacy_why_body:"Only to produce your card and display, in an emergency, the information you have authorized.",legal_privacy_scan_title:"What the person scanning sees",legal_privacy_scan_body:"Your photo, your name, the card's identifier, the health information marked “visible” and your emergency contacts. A deactivated card shows nothing.",legal_privacy_qr_title:"The QR code",legal_privacy_qr_body:"It contains no personal data, only a random key that cannot be guessed, revocable at any time.",legal_privacy_rights_title:"Your rights",legal_privacy_rights_body:"Edit your data, deactivate your card or delete your account from “My space”. Contact: via the Help page.",legal_privacy_retention_title:"Retention",legal_privacy_retention_body:"For the entire lifetime of your card, then deletion upon request.",contact_h1:"Contact",contact_lead:"A question about your card, a payment or your account? Write to us by email or WhatsApp: we usually reply within 24 to 48 business hours.",contact_email_title:"By email",contact_email_desc:"For any detailed question or one with an attachment.",contact_wa_title:"By WhatsApp",contact_wa_desc:"For a quick reply, Monday to Saturday.",contact_write_title:"Write to us directly",contact_subject_label:"Subject",contact_opt_payment:"Payment issue",contact_opt_card:"Card issue",contact_opt_qr:"QR issue",contact_opt_data:"Data change",contact_opt_account:"Lost account",contact_opt_refund:"Refund",contact_opt_technical:"Technical issue",contact_opt_other:"Other",contact_phone_email_label:"Your phone or email",contact_message_label:"Message",contact_send_btn:"Send",contact_footer_note:"You can also check our <a href=\"#/aide\">help page</a> or our <a href=\"#/conditions\">terms of use</a>.",contact_err_missing:"Provide a contact and a message.",contact_sent_toast:"Message sent. We'll get back to you soon.",legal_terms_h1:"Terms of use",legal_terms_notice:"Working text to be validated by a lawyer in each launch country before any commercial use.",legal_terms_s1_title:"1. Purpose",legal_terms_s1_body:"IFRIQI is a private, non-medical and unofficial service allowing you to create a personal identification and emergency card linked to a QR code. By creating an account or buying a card, you accept these terms.",legal_terms_s2_title:"2. What IFRIQI is not",legal_terms_s2_body:"IFRIQI is not an official ID document, a medical record, an emergency service, or a diagnostic service. The information shown after scanning is declared by the holder or their legal representative and does not replace a medical evaluation.",legal_terms_s3_title:"3. Account and accuracy of information",legal_terms_s3_body:"You are responsible for the accuracy of the information provided (identity, contacts, health information) and for keeping it up to date. A child profile can only be created by a parent or legal guardian.",legal_terms_s4_title:"4. Card and edits",legal_terms_s4_body:"The IFRIQI card has no expiry date. Payment includes a limited number of edits to your information (4 by default). Beyond that, a new edits pack must be bought to keep editing your profile; the card remains active and functional in the meantime.",legal_terms_s5_title:"5. Payment",legal_terms_s5_body:"Payment is made via Mobile Money, bank card, PayPal or any other method available depending on the gateway in your country. The card is only activated once the provider confirms the payment.",legal_terms_s6_title:"6. Refund policy",legal_terms_refund_1:"<b>Withdrawal period.</b> You can request a full refund of your card within 7 calendar days of purchase, provided the QR code has not already been scanned and the card has not been printed and used.",legal_terms_refund_2:"<b>Payment error or double charge.</b> Any double payment, charge without a card being created, or technical error attributable to IFRIQI or its payment gateway is refunded in full, with no withdrawal period, upon verification.",legal_terms_refund_3:"<b>After the 7-day period.</b> After this period, or if the card has already been actively used (printed, scanned), the card is no longer refundable, but remains usable indefinitely.",legal_terms_refund_4:"<b>Edit packs.</b> An unused edits pack can be refunded within 7 days of purchase; a pack already partially used is not refundable.",legal_terms_refund_5:"<b>How to request a refund.</b> Contact us via the <a href=\"#/contact\">Contact</a> page (email or WhatsApp) stating your payment reference. The refund is made to the same payment method used for the purchase, within 5 to 10 business days depending on the gateway.",legal_terms_refund_6:"<b>Referral programme commissions.</b> A commission linked to a refunded order is cancelled in accordance with the referral programme's rules.",legal_terms_s7_title:"7. Deactivation and deletion",legal_terms_s7_body:"You can deactivate your card or delete your account at any time from “My space”. Deleting the account results in the deletion of associated data, subject to legal retention obligations.",legal_terms_s8_title:"8. Referral programme",legal_terms_s8_body:"Becoming a distributor is free and optional. Commissions are only due on direct sales, actually paid, made through the distributor's referral link, according to the rules detailed on the “Recommend the card” page.",legal_terms_s9_title:"9. Liability",legal_terms_s9_body:"IFRIQI does everything possible to ensure the service is available, without guaranteeing uninterrupted operation (network, hosting, payment gateway). IFRIQI cannot be held liable for a medical or emergency decision made based on information displayed by a third party.",legal_terms_s10_title:"10. Changes to these terms",legal_terms_s10_body:"These terms may be updated; the version in force is the one published on this page. Contact: <a href=\"#/contact\">Contact page</a>.",help_h1:"Help and contact",help_faq_title:"Frequently asked questions",help_q1:"Do I need an app to scan?",help_a1:"No. Any smartphone's camera is enough.",help_q2:"I've lost my card.",help_a2:"In “My space”, deactivate the card or generate a new QR code: the old one stops working. Neither action uses up an edit.",help_q3:"Can I edit my information without reprinting?",help_a3:"Yes, except for a printed photo, name or contact: in that case, a new card is offered.",help_q4:"What payment methods are available?",help_a4:"Mobile Money, bank card, PayPal and other methods, depending on the payment gateway available in your country.",help_q5:"Does my card expire?",help_a5:"No. Payment includes 4 edits to your information. Once used, the card keeps working; to edit again, you pay for a new pack of 4 edits.",help_q6:"Does the card replace my ID?",help_a6:"No, it's a complementary private service.",help_write_title:"Write to us",pwd_title:"Change my password",pwd_current_label:"Current password",pwd_new_label:"New password",pwd_new_placeholder:"At least 6 characters",pwd_confirm_label:"Confirm the new password",pwd_save_btn:"Save",pwd_err_missing:"Fill in all three fields.",pwd_err_wrong_current:"The current password is incorrect.",pwd_err_too_short:"The new password must be at least 6 characters long.",pwd_err_mismatch:"The two new passwords do not match.",pwd_err_same:"The new password must be different from the old one.",pwd_changed_toast:"Password changed.",auth_err_pw_short:"The password must be at least 6 characters long.",auth_err_name:"Enter your first and last name.",auth_err_country:"Choose your country.",auth_err_dial:"Choose the dialing code.",auth_err_phone:"Enter a valid phone number (without the dialing code).",auth_err_email:"Enter a valid email address.",auth_err_duplicate:"This phone or email is already in use. Use “Log in”.",auth_err_id_required:"Enter your phone or email.",auth_err_bad_login:"Incorrect ID or password.",auth_err_suspended:"This account is suspended. Contact support.",auth_forgot_toast:"Demo: in production, an OTP code is sent by SMS or email.",g_no_data:"No data yet."},

on_title:"الاحتفاظ",legal_privacy_retention_body:"طوال فترة صلاحية بطاقتك، ثم يتم الحذف عند الطلب.",contact_h1:"اتصل بنا",contact_lead:"لديك سؤال حول بطاقتك، أو دفعة، أو حسابك؟ اكتب إلينا عبر البريد الإلكتروني أو واتساب: نرد عادةً في غضون 24 إلى 48 ساعة عمل.",contact_email_title:"عبر البريد الإلكتروني",contact_email_desc:"لأي سؤال مفصّل أو مرفق بملف.",contact_wa_title:"عبر واتساب",contact_wa_desc:"للحصول على رد سريع، من الاثنين إلى السبت.",contact_write_title:"اكتب إلينا مباشرة",contact_subject_label:"الموضوع",contact_opt_payment:"مشكلة في الدفع",contact_opt_card:"مشكلة في البطاقة",contact_opt_qr:"مشكلة في رمز QR",contact_opt_data:"تعديل البيانات",contact_opt_account:"فقدان الحساب",contact_opt_refund:"استرداد",contact_opt_technical:"مشكلة تقنية",contact_opt_other:"أخرى",contact_phone_email_label:"هاتفك أو بريدك الإلكتروني",contact_message_label:"الرسالة",contact_send_btn:"إرسال",contact_footer_note:"يمكنك أيضًا مراجعة <a href=\"#/aide\">صفحة المساعدة</a> أو <a href=\"#/conditions\">شروط الاستخدام</a>.",contact_err_missing:"أدخل جهة اتصال ورسالة.",contact_sent_toast:"تم إرسال الرسالة. سنرد عليك قريبًا.",legal_terms_h1:"شروط الاستخدام",legal_terms_notice:"نص عمل يجب التصديق عليه من قبل محامٍ في كل بلد يتم فيه الإطلاق قبل أي استخدام تجاري.",legal_terms_s1_title:"1. الموضوع",legal_terms_s1_body:"IFRIQI هي خدمة خاصة، غير طبية وغير رسمية، تتيح إنشاء بطاقة شخصية للتعريف والطوارئ مرتبطة برمز QR. بإنشاء حساب أو شراء بطاقة، فإنك توافق على هذه الشروط.",legal_terms_s2_title:"2. ما لا تكون عليه IFRIQI",legal_terms_s2_body:"IFRIQI ليست وثيقة هوية رسمية، ولا ملفًا طبيًا، ولا خدمة طوارئ، ولا خدمة تشخيص. المعلومات المعروضة بعد المسح مُصرَّح بها من قبل صاحب البطاقة أو ممثله القانوني ولا تحل محل التقييم الطبي.",legal_terms_s3_title:"3. الحساب ودقة المعلومات",legal_terms_s3_body:"أنت المسؤول عن دقة المعلومات المُدخلة (الهوية، جهات الاتصال، المعلومات الصحية) وعن تحديثها. لا يمكن إنشاء ملف الطفل إلا من قبل أحد الوالدين أو ممثل قانوني.",legal_terms_s4_title:"4. البطاقة والتعديلات",legal_terms_s4_body:"بطاقة IFRIQI لا تحمل تاريخ انتهاء. يشمل الدفع عددًا محدودًا من التعديلات على معلوماتك (4 افتراضيًا). بعد ذلك، يجب شراء باقة تعديلات جديدة لمواصلة تعديل ملفك؛ تبقى البطاقة نشطة وتعمل في هذه الفترة.",legal_terms_s5_title:"5. الدفع",legal_terms_s5_body:"يتم الدفع عبر Mobile Money، بطاقة بنكية، PayPal أو أي وسيلة أخرى متاحة حسب بوابة الدفع المتوفرة في بلدك. لا تُفعَّل البطاقة إلا بعد تأكيد الدفع من قبل المزوّد.",legal_terms_s6_title:"6. سياسة الاسترداد",legal_terms_refund_1:"<b>فترة التراجع.</b> يمكنك طلب استرداد كامل لثمن بطاقتك في غضون 7 أيام تقويمية بعد الشراء، بشرط ألا يكون رمز QR قد تم مسحه مسبقًا ولا البطاقة مطبوعة ومستخدمة.",legal_terms_refund_2:"<b>خطأ في الدفع أو خصم مزدوج.</b> يتم استرداد أي دفع مزدوج، أو خصم دون إنشاء بطاقة، أو خطأ تقني يُنسب إلى IFRIQI أو إلى بوابة الدفع الخاصة بها بالكامل، دون فترة تراجع، بعد التحقق.",legal_terms_refund_3:"<b>بعد مرور 7 أيام.</b> بعد انتهاء هذه الفترة، أو إذا كانت البطاقة قد استُخدمت فعليًا (طباعة، مسح)، لا تعود البطاقة قابلة للاسترداد، لكنها تبقى قابلة للاستخدام دون حد زمني.",legal_terms_refund_4:"<b>باقات التعديلات.</b> يمكن استرداد باقة تعديلات غير مستخدمة في غضون 7 أيام من شرائها؛ أما الباقة المستخدمة جزئيًا فلا تُسترد.",legal_terms_refund_5:"<b>كيف تطلب الاسترداد.</b> تواصل معنا عبر صفحة <a href=\"#/contact\">الاتصال</a> (بريد إلكتروني أو واتساب) مع ذكر مرجع دفعتك. يتم الاسترداد إلى وسيلة الدفع نفسها المستخدمة في الشراء، في غضون 5 إلى 10 أيام عمل حسب بوابة الدفع.",legal_terms_refund_6:"<b>عمولات برنامج التوصية.</b> يتم إلغاء العمولة المرتبطة بطلب مُستَرَد وفقًا لقواعد برنامج التوصية.",legal_terms_s7_title:"7. التعطيل والحذف",legal_terms_s7_body:"يمكنك تعطيل بطاقتك أو حذف حسابك في أي وقت من «مساحتي». يؤدي حذف الحساب إلى حذف البيانات المرتبطة به، مع مراعاة الالتزامات القانونية بالاحتفاظ بالبيانات.",legal_terms_s8_title:"8. برنامج التوصية",legal_terms_s8_body:"أن تصبح موزّعًا أمر مجاني واختياري. لا تُستحق العمولات إلا على المبيعات المباشرة والمدفوعة فعليًا والتي تتم عبر رابط الموزّع التجاري، وفقًا للقواعد المفصّلة في صفحة «أوصِ بالبطاقة».",legal_terms_s9_title:"9. المسؤولية",legal_terms_s9_body:"تسعى IFRIQI بكل جهدها لضمان توفر الخدمة، دون أن تضمن عملًا متواصلًا دون انقطاع (الشبكة، الاستضافة، بوابة الدفع). لا يمكن تحميل IFRIQI المسؤولية عن أي قرار طبي أو طارئ يُتخذ بناءً على معلومات عرضها طرف ثالث.",legal_terms_s10_title:"10. تعديل الشروط",legal_terms_s10_body:"يمكن تحديث هذه الشروط؛ والنسخة المعمول بها هي تلك المنشورة في هذه الصفحة. للتواصل: <a href=\"#/contact\">صفحة الاتصال</a>.",help_h1:"المساعدة والاتصال",help_faq_title:"الأسئلة الشائعة",help_q1:"هل أحتاج إلى تطبيق للمسح؟",help_a1:"لا. تكفي كاميرا أي هاتف ذكي.",help_q2:"فقدت بطاقتي.",help_a2:"في «مساحتي»، عطّل البطاقة أو أنشئ رمز QR جديدًا: يتوقف القديم عن العمل. هذان الإجراءان لا يستهلكان أي تعديل.",help_q3:"هل يمكنني تعديل معلوماتي دون إعادة الطباعة؟",help_a3:"نعم، إلا الصورة أو الاسم أو جهة الاتصال المطبوعة: في هذه الحالة، تُعرض بطاقة جديدة.",help_q4:"ما هي وسائل الدفع المتاحة؟",help_a4:"Mobile Money، البطاقة البنكية، PayPal وغيرها، حسب بوابة الدفع المتاحة في بلدك.",help_q5:"هل تنتهي صلاحية بطاقتي؟",help_a5:"لا. يشمل الدفع 4 تعديلات لمعلوماتك. بعد استخدامها، تستمر البطاقة في العمل؛ للتعديل مرة أخرى، تدفع ثمن باقة جديدة من 4 تعديلات.",help_q6:"هل تحل البطاقة محل وثيقة هويتي؟",help_a6:"لا، إنها خدمة خاصة تكميلية.",help_write_title:"اكتب إلينا",pwd_title:"تغيير كلمة مروري",pwd_current_label:"كلمة المرور الحالية",pwd_new_label:"كلمة المرور الجديدة",pwd_new_placeholder:"6 أحرف على الأقل",pwd_confirm_label:"تأكيد كلمة المرور الجديدة",pwd_save_btn:"حفظ",pwd_err_missing:"أدخل الحقول الثلاثة.",pwd_err_wrong_current:"كلمة المرور الحالية غير صحيحة.",pwd_err_too_short:"يجب أن تحتوي كلمة المرور الجديدة على 6 أحرف على الأقل.",pwd_err_mismatch:"كلمتا المرور الجديدتان غير متطابقتين.",pwd_err_same:"يجب أن تكون كلمة المرور الجديدة مختلفة عن القديمة.",pwd_changed_toast:"تم تغيير كلمة المرور.",auth_err_pw_short:"يجب أن تحتوي كلمة المرور على 6 أحرف على الأقل.",auth_err_name:"أدخل اسمك الأول واسم عائلتك.",auth_err_country:"اختر بلدك.",auth_err_dial:"اختر رمز الاتصال الهاتفي.",auth_err_phone:"أدخل رقم هاتف صالح (بدون رمز الاتصال).",auth_err_email:"أدخل عنوان بريد إلكتروني صالح.",auth_err_duplicate:"هذا الهاتف أو هذا البريد الإلكتروني مُستخدم بالفعل. استخدم «تسجيل الدخول».",auth_err_id_required:"أدخل هاتفك أو بريدك الإلكتروني.",auth_err_bad_login:"اسم المستخدم أو كلمة المرور غير صحيحة.",auth_err_suspended:"هذا الحساب موقوف. تواصل مع الدعم.",auth_forgot_toast:"عرض تجريبي: في الإصدار النهائي، يُرسل رمز OTP عبر رسالة نصية أو بريد إلكتروني.",g_no_data:"لا توجد بيانات حاليًا."},

adm_tab_params:"Parâmetros",adm_tab_users:"Utilizadores",adm_tab_cards:"Cartões",adm_tab_payments:"Pagamentos",adm_tab_scans:"Escaneamentos",adm_tab_log:"Diário",adm_tab_support:"Suporte",adm_tab_gateway:"Pagamento",adm_backoffice_title:"Back-office",adm_exit_btn:"Sair",adm_confirm_reset:"Eliminar TODOS os dados da demonstração?",adm_reset_btn:"Eliminar tudo",adm_min_payment_toast:"Pelo menos um meio de pagamento deve permanecer ativo.",legal_privacy_h1:"Política de privacidade",legal_privacy_notice:"Texto de trabalho a ser validado por um jurista em cada país de lançamento (dados de saúde, menores, transferências internacionais). Exemplo nos Camarões: lei n.º 2024/017, de 23 de dezembro de 2024, sobre a proteção de dados pessoais.",legal_privacy_data_title:"Dados recolhidos",legal_privacy_data_body:"Identidade, data de nascimento, foto, contactos de emergência e, se desejar, informações de saúde essenciais. Não recolhemos mais nada.",legal_privacy_why_title:"Porquê",legal_privacy_why_body:"Apenas para produzir o seu cartão e apresentar, em caso de emergência, as informações que autorizou.",legal_privacy_scan_title:"O que vê a pessoa que escaneia",legal_privacy_scan_body:"A sua foto, o seu nome, o identificador do cartão, as informações de saúde marcadas como «visíveis» e os seus contactos de emergência. Um cartão desativado não mostra nada.",legal_privacy_qr_title:"O código QR",legal_privacy_qr_body:"Não contém nenhum dado pessoal, apenas uma chave aleatória não adivinhável, revogável em qualquer momento.",legal_privacy_rights_title:"Os seus direitos",legal_privacy_rights_body:"Editar os seus dados, desativar o seu cartão ou eliminar a sua conta a partir de «O meu espaço». Contacto: através da página de Ajuda.",legal_privacy_retention_title:"Conservação",legal_privacy_retention_body:"Durante toda a vida do seu cartão, seguida de eliminação a pedido.",contact_h1:"Contacto",contact_lead:"Uma pergunta sobre o seu cartão, um pagamento ou a sua conta? Escreva-nos por e-mail ou WhatsApp: respondemos geralmente em 24 a 48 horas úteis.",contact_email_title:"Por e-mail",contact_email_desc:"Para qualquer pergunta detalhada ou com anexo.",contact_wa_title:"Por WhatsApp",contact_wa_desc:"Para uma resposta rápida, de segunda a sábado.",contact_write_title:"Escreva-nos diretamente",contact_subject_label:"Assunto",contact_opt_payment:"Problema de pagamento",contact_opt_card:"Problema do cartão",contact_opt_qr:"Problema do QR",contact_opt_data:"Alteração de dados",contact_opt_account:"Perda de conta",contact_opt_refund:"Reembolso",contact_opt_technical:"Problema técnico",contact_opt_other:"Outro",contact_phone_email_label:"O seu telefone ou e-mail",contact_message_label:"Mensagem",contact_send_btn:"Enviar",contact_footer_note:"Também pode consultar a nossa <a href=\"#/aide\">página de ajuda</a> ou os nossos <a href=\"#/conditions\">termos de utilização</a>.",contact_err_missing:"Indique um contacto e uma mensagem.",contact_sent_toast:"Mensagem enviada. Responderemos rapidamente.",legal_terms_h1:"Termos de utilização",legal_terms_notice:"Texto de trabalho a ser validado por um jurista em cada país de lançamento antes de qualquer uso comercial.",legal_terms_s1_title:"1. Objeto",legal_terms_s1_body:"A IFRIQI é um serviço privado, não médico e não oficial, que permite criar um cartão pessoal de identificação e emergência associado a um código QR. Ao criar uma conta ou comprar um cartão, aceita os presentes termos.",legal_terms_s2_title:"2. O que a IFRIQI não é",legal_terms_s2_body:"A IFRIQI não é um documento de identidade oficial, nem um processo médico, nem um serviço de emergência, nem um serviço de diagnóstico. As informações apresentadas após um escaneamento são declaradas pelo titular ou pelo seu representante legal e não substituem uma avaliação médica.",legal_terms_s3_title:"3. Conta e exatidão das informações",legal_terms_s3_body:"É responsável pela exatidão das informações indicadas (identidade, contactos, informações de saúde) e pela sua atualização. Um perfil infantil só pode ser criado por um progenitor ou representante legal.",legal_terms_s4_title:"4. Cartão e edições",legal_terms_s4_body:"O cartão IFRIQI não tem data de validade. O pagamento inclui um número limitado de edições às suas informações (4 por defeito). Além disso, é necessário comprar um novo pacote de edições para continuar a editar o seu perfil; o cartão permanece ativo e funcional entretanto.",legal_terms_s5_title:"5. Pagamento",legal_terms_s5_body:"O pagamento é efetuado via Mobile Money, cartão bancário, PayPal ou qualquer outro meio proposto segundo a passarela disponível no seu país. O cartão só é ativado após a confirmação do pagamento pelo prestador.",legal_terms_s6_title:"6. Política de reembolso",legal_terms_refund_1:"<b>Prazo de retratação.</b> Pode solicitar o reembolso integral do seu cartão num prazo de 7 dias de calendário após a compra, desde que o código QR ainda não tenha sido escaneado nem o cartão impresso e utilizado.",legal_terms_refund_2:"<b>Erro de pagamento ou débito duplicado.</b> Qualquer pagamento duplicado, débito sem criação de cartão, ou erro técnico imputável à IFRIQI ou à sua passarela de pagamento é reembolsado integralmente, sem prazo de retratação, após verificação.",legal_terms_refund_3:"<b>Após o prazo de 7 dias.</b> Após este prazo, ou se o cartão já tiver sido ativamente utilizado (impressão, escaneamento), o cartão deixa de ser reembolsável, mas continua utilizável sem limite de duração.",legal_terms_refund_4:"<b>Pacotes de edições.</b> Um pacote de edições não consumido pode ser reembolsado dentro de 7 dias após a compra; um pacote já parcialmente utilizado não é reembolsável.",legal_terms_refund_5:"<b>Como solicitar um reembolso.</b> Contacte-nos através da página <a href=\"#/contact\">Contacto</a> (e-mail ou WhatsApp) indicando a referência do seu pagamento. O reembolso é efetuado no mesmo meio de pagamento utilizado na compra, em 5 a 10 dias úteis, dependendo da passarela.",legal_terms_refund_6:"<b>Comissões do programa de recomendação.</b> Uma comissão associada a uma encomenda reembolsada é anulada em conformidade com as regras do programa de recomendação.",legal_terms_s7_title:"7. Desativação e eliminação",legal_terms_s7_body:"Pode desativar o seu cartão ou eliminar a sua conta em qualquer momento a partir de «O meu espaço». A eliminação da conta implica a eliminação dos dados associados, sujeita às obrigações legais de conservação.",legal_terms_s8_title:"8. Programa de recomendação",legal_terms_s8_body:"Tornar-se distribuidor é gratuito e facultativo. As comissões só são devidas sobre vendas diretas, efetivamente pagas, realizadas através do link comercial do distribuidor, segundo as regras detalhadas na página «Recomendar o cartão».",legal_terms_s9_title:"9. Responsabilidade",legal_terms_s9_body:"A IFRIQI faz tudo o que está ao seu alcance para garantir a disponibilidade do serviço, sem garantir um funcionamento ininterrupto (rede, alojamento, passarela de pagamento). A IFRIQI não pode ser responsabilizada por uma decisão médica ou de emergência tomada com base em informações exibidas por terceiros.",legal_terms_s10_title:"10. Alteração dos termos",legal_terms_s10_body:"Estes termos podem ser atualizados; a versão em vigor é a publicada nesta página. Contacto: <a href=\"#/contact\">página de Contacto</a>.",help_h1:"Ajuda e contacto",help_faq_title:"Perguntas frequentes",help_q1:"É preciso uma aplicação para escanear?",help_a1:"Não. A câmara de qualquer smartphone é suficiente.",help_q2:"Perdi o meu cartão.",help_a2:"Em «O meu espaço», desative o cartão ou gere um novo código QR: o antigo deixa de funcionar. Nenhuma destas ações consome edições.",help_q3:"Posso editar as minhas informações sem reimprimir?",help_a3:"Sim, exceto foto, nome ou contacto impressos: nesse caso, é proposto um novo cartão.",help_q4:"Que meios de pagamento?",help_a4:"Mobile Money, cartão bancário, PayPal e outros meios, segundo a passarela de pagamento disponível no seu país.",help_q5:"O meu cartão expira?",help_a5:"Não. O pagamento inclui 4 edições às suas informações. Uma vez utilizadas, o cartão continua a funcionar; para editar novamente, paga um novo pacote de 4 edições.",help_q6:"O cartão substitui o meu documento de identidade?",help_a6:"Não, é um serviço privado complementar.",help_write_title:"Escreva-nos",pwd_title:"Alterar a minha palavra-passe",pwd_current_label:"Palavra-passe atual",pwd_new_label:"Nova palavra-passe",pwd_new_placeholder:"Mínimo de 6 caracteres",pwd_confirm_label:"Confirmar a nova palavra-passe",pwd_save_btn:"Guardar",pwd_err_missing:"Preencha os três campos.",pwd_err_wrong_current:"A palavra-passe atual está incorreta.",pwd_err_too_short:"A nova palavra-passe deve ter pelo menos 6 caracteres.",pwd_err_mismatch:"As duas novas palavras-passe não coincidem.",pwd_err_same:"A nova palavra-passe deve ser diferente da anterior.",pwd_changed_toast:"Palavra-passe alterada.",auth_err_pw_short:"A palavra-passe deve ter pelo menos 6 caracteres.",auth_err_name:"Indique o seu nome e sobrenome.",auth_err_country:"Escolha o seu país.",auth_err_dial:"Escolha o indicativo telefónico.",auth_err_phone:"Indique um número de telefone válido (sem o indicativo).",auth_err_email:"Indique um endereço de e-mail válido.",auth_err_duplicate:"Este telefone ou e-mail já está em uso. Utilize «Entrar».",auth_err_id_required:"Indique o seu telefone ou e-mail.",auth_err_bad_login:"Identificador ou palavra-passe incorretos.",auth_err_suspended:"Esta conta está suspensa. Contacte o suporte.",auth_forgot_toast:"Demonstração: em produção, um código OTP é enviado por SMS ou e-mail.",g_no_data:"Ainda não há dados."},

"Escaneos",adm_tab_log:"Registro",adm_tab_support:"Soporte",adm_tab_gateway:"Pago",adm_backoffice_title:"Back-office",adm_exit_btn:"Salir",adm_confirm_reset:"¿Borrar TODOS los datos de la demostración?",adm_reset_btn:"Borrar todo",adm_min_payment_toast:"Al menos un método de pago debe permanecer activo.",legal_privacy_h1:"Política de privacidad",legal_privacy_notice:"Texto de trabajo que debe validar un jurista en cada país de lanzamiento (datos de salud, menores, transferencias internacionales). Ejemplo en Camerún: ley n.º 2024/017 del 23 de diciembre de 2024 sobre protección de datos personales.",legal_privacy_data_title:"Datos recopilados",legal_privacy_data_body:"Identidad, fecha de nacimiento, foto, contactos de emergencia y, si lo deseas, información de salud esencial. No recopilamos nada más.",legal_privacy_why_title:"Por qué",legal_privacy_why_body:"Solo para generar tu tarjeta y mostrar, en caso de emergencia, la información que has autorizado.",legal_privacy_scan_title:"Lo que ve la persona que escanea",legal_privacy_scan_body:"Tu foto, tu nombre, el identificador de la tarjeta, la información de salud marcada como «visible» y tus contactos de emergencia. Una tarjeta desactivada no muestra nada.",legal_privacy_qr_title:"El código QR",legal_privacy_qr_body:"No contiene ningún dato personal, solo una clave aleatoria no adivinable, revocable en cualquier momento.",legal_privacy_rights_title:"Tus derechos",legal_privacy_rights_body:"Editar tus datos, desactivar tu tarjeta o eliminar tu cuenta desde «Mi espacio». Contacto: a través de la página de Ayuda.",legal_privacy_retention_title:"Conservación",legal_privacy_retention_body:"Durante toda la vida de tu tarjeta, seguida de eliminación a solicitud.",contact_h1:"Contacto",contact_lead:"¿Tienes una pregunta sobre tu tarjeta, un pago o tu cuenta? Escríbenos por correo electrónico o WhatsApp: normalmente respondemos en 24 a 48 horas hábiles.",contact_email_title:"Por correo electrónico",contact_email_desc:"Para cualquier pregunta detallada o con un archivo adjunto.",contact_wa_title:"Por WhatsApp",contact_wa_desc:"Para una respuesta rápida, de lunes a sábado.",contact_write_title:"Escríbenos directamente",contact_subject_label:"Asunto",contact_opt_payment:"Problema de pago",contact_opt_card:"Problema con la tarjeta",contact_opt_qr:"Problema con el QR",contact_opt_data:"Cambio de datos",contact_opt_account:"Pérdida de cuenta",contact_opt_refund:"Reembolso",contact_opt_technical:"Problema técnico",contact_opt_other:"Otro",contact_phone_email_label:"Tu teléfono o correo electrónico",contact_message_label:"Mensaje",contact_send_btn:"Enviar",contact_footer_note:"También puedes consultar nuestra <a href=\"#/aide\">página de ayuda</a> o nuestras <a href=\"#/conditions\">condiciones de uso</a>.",contact_err_missing:"Indica un contacto y un mensaje.",contact_sent_toast:"Mensaje enviado. Te responderemos pronto.",legal_terms_h1:"Condiciones de uso",legal_terms_notice:"Texto de trabajo que debe validar un jurista en cada país de lanzamiento antes de cualquier uso comercial.",legal_terms_s1_title:"1. Objeto",legal_terms_s1_body:"IFRIQI es un servicio privado, no médico y no oficial, que permite crear una tarjeta personal de identificación y emergencia asociada a un código QR. Al crear una cuenta o comprar una tarjeta, aceptas estas condiciones.",legal_terms_s2_title:"2. Lo que IFRIQI no es",legal_terms_s2_body:"IFRIQI no es un documento de identidad oficial, ni un historial médico, ni un servicio de emergencias, ni un servicio de diagnóstico. La información mostrada tras escanear es declarada por el titular o su representante legal y no sustituye una evaluación médica.",legal_terms_s3_title:"3. Cuenta y exactitud de la información",legal_terms_s3_body:"Eres responsable de la exactitud de la información proporcionada (identidad, contactos, información de salud) y de su actualización. Un perfil infantil solo puede ser creado por un padre, madre o representante legal.",legal_terms_s4_title:"4. Tarjeta y ediciones",legal_terms_s4_body:"La tarjeta IFRIQI no tiene fecha de caducidad. El pago incluye un número limitado de ediciones de tu información (4 por defecto). Más allá de eso, hay que comprar un nuevo paquete de ediciones para seguir editando tu perfil; la tarjeta permanece activa y funcional mientras tanto.",legal_terms_s5_title:"5. Pago",legal_terms_s5_body:"El pago se realiza mediante Mobile Money, tarjeta bancaria, PayPal u otro medio disponible según la pasarela de tu país. La tarjeta solo se activa tras la confirmación del pago por el proveedor.",legal_terms_s6_title:"6. Política de reembolso",legal_terms_refund_1:"<b>Plazo de desistimiento.</b> Puedes solicitar el reembolso íntegro de tu tarjeta dentro de un plazo de 7 días naturales tras la compra, siempre que el código QR no haya sido escaneado ni la tarjeta impresa y utilizada.",legal_terms_refund_2:"<b>Error de pago o doble cobro.</b> Cualquier doble pago, cobro sin creación de tarjeta, o error técnico atribuible a IFRIQI o a su pasarela de pago se reembolsa íntegramente, sin plazo de desistimiento, tras su verificación.",legal_terms_refund_3:"<b>Tras el plazo de 7 días.</b> Pasado este plazo, o si la tarjeta ya ha sido usada activamente (impresión, escaneo), la tarjeta ya no es reembolsable, pero sigue siendo utilizable sin límite de duración.",legal_terms_refund_4:"<b>Paquetes de ediciones.</b> Un paquete de ediciones no consumido puede reembolsarse dentro de los 7 días siguientes a su compra; un paquete ya parcialmente usado no es reembolsable.",legal_terms_refund_5:"<b>Cómo solicitar un reembolso.</b> Contáctanos a través de la página <a href=\"#/contact\">Contacto</a> (correo electrónico o WhatsApp) indicando la referencia de tu pago. El reembolso se realiza al mismo medio de pago utilizado en la compra, en un plazo de 5 a 10 días hábiles según la pasarela.",legal_terms_refund_6:"<b>Comisiones del programa de recomendación.</b> Una comisión vinculada a un pedido reembolsado se anula conforme a las reglas del programa de recomendación.",legal_terms_s7_title:"7. Desactivación y eliminación",legal_terms_s7_body:"Puedes desactivar tu tarjeta o eliminar tu cuenta en cualquier momento desde «Mi espacio». La eliminación de la cuenta implica la eliminación de los datos asociados, sujeta a las obligaciones legales de conservación.",legal_terms_s8_title:"8. Programa de recomendación",legal_terms_s8_body:"Convertirse en distribuidor es gratuito y opcional. Las comisiones solo se deben por ventas directas, efectivamente pagadas, realizadas a través del enlace comercial del distribuidor, según las reglas detalladas en la página «Recomendar la tarjeta».",legal_terms_s9_title:"9. Responsabilidad",legal_terms_s9_body:"IFRIQI hace todo lo posible para garantizar la disponibilidad del servicio, sin garantizar un funcionamiento ininterrumpido (red, alojamiento, pasarela de pago). IFRIQI no puede ser considerada responsable de una decisión médica o de emergencia tomada en base a información mostrada por un tercero.",legal_terms_s10_title:"10. Modificación de las condiciones",legal_terms_s10_body:"Estas condiciones pueden actualizarse; la versión vigente es la publicada en esta página. Contacto: <a href=\"#/contact\">página de Contacto</a>.",help_h1:"Ayuda y contacto",help_faq_title:"Preguntas frecuentes",help_q1:"¿Hace falta una aplicación para escanear?",help_a1:"No. La cámara de cualquier smartphone es suficiente.",help_q2:"He perdido mi tarjeta.",help_a2:"En «Mi espacio», desactiva la tarjeta o genera un nuevo código QR: el anterior deja de funcionar. Ninguna de estas dos acciones consume ediciones.",help_q3:"¿Puedo editar mi información sin reimprimir?",help_a3:"Sí, excepto la foto, el nombre o el contacto impreso: en ese caso, se ofrece una nueva tarjeta.",help_q4:"¿Qué métodos de pago hay?",help_a4:"Mobile Money, tarjeta bancaria, PayPal y otros medios, según la pasarela de pago disponible en tu país.",help_q5:"¿Mi tarjeta caduca?",help_a5:"No. El pago incluye 4 ediciones de tu información. Una vez usadas, la tarjeta sigue funcionando; para editar de nuevo, pagas un nuevo paquete de 4 ediciones.",help_q6:"¿La tarjeta reemplaza mi documento de identidad?",help_a6:"No, es un servicio privado complementario.",help_write_title:"Escríbenos",pwd_title:"Cambiar mi contraseña",pwd_current_label:"Contraseña actual",pwd_new_label:"Nueva contraseña",pwd_new_placeholder:"Mínimo 6 caracteres",pwd_confirm_label:"Confirmar la nueva contraseña",pwd_save_btn:"Guardar",pwd_err_missing:"Completa los tres campos.",pwd_err_wrong_current:"La contraseña actual es incorrecta.",pwd_err_too_short:"La nueva contraseña debe tener al menos 6 caracteres.",pwd_err_mismatch:"Las dos nuevas contraseñas no coinciden.",pwd_err_same:"La nueva contraseña debe ser diferente de la anterior.",pwd_changed_toast:"Contraseña modificada.",auth_err_pw_short:"La contraseña debe tener al menos 6 caracteres.",auth_err_name:"Indica tu nombre y apellido.",auth_err_country:"Elige tu país.",auth_err_dial:"Elige el prefijo telefónico.",auth_err_phone:"Indica un número de teléfono válido (sin el prefijo).",auth_err_email:"Indica una dirección de correo válida.",auth_err_duplicate:"Este teléfono o correo ya está en uso. Usa «Iniciar sesión».",auth_err_id_required:"Indica tu teléfono o correo electrónico.",auth_err_bad_login:"Identificador o contraseña incorrectos.",auth_err_suspended:"Esta cuenta está suspendida. Contacta con soporte.",auth_forgot_toast:"Demostración: en producción, se envía un código OTP por SMS o correo electrónico.",g_no_data:"Todavía no hay datos."},

ort:"Msaada",adm_tab_gateway:"Malipo",adm_backoffice_title:"Ofisi ya nyuma",adm_exit_btn:"Toka",adm_confirm_reset:"Futa data ZOTE za onyesho?",adm_reset_btn:"Futa yote",adm_min_payment_toast:"Angalau njia moja ya malipo inapaswa kubaki hai.",legal_privacy_h1:"Sera ya faragha",legal_privacy_notice:"Maandishi ya kazi yanayopaswa kuthibitishwa na wakili katika kila nchi ya uzinduzi (data za afya, watoto, uhamishaji wa kimataifa). Mfano nchini Cameroon: sheria nambari 2024/017 ya tarehe 23 Desemba 2024 kuhusu ulinzi wa data za kibinafsi.",legal_privacy_data_title:"Data zinazokusanywa",legal_privacy_data_body:"Utambulisho, tarehe ya kuzaliwa, picha, mawasiliano ya dharura na, ukipenda, taarifa muhimu za afya. Hatukusanyi kitu kingine.",legal_privacy_why_title:"Kwa nini",legal_privacy_why_body:"Tu kwa ajili ya kutengeneza kadi yako na kuonyesha, endapo kuna dharura, taarifa ulizoziruhusu.",legal_privacy_scan_title:"Kinachoonekana na mtu anayesoma msimbo",legal_privacy_scan_body:"Picha yako, jina lako, kitambulisho cha kadi, taarifa za afya zilizowekwa alama ya «zinazoonekana» na mawasiliano yako ya dharura. Kadi iliyozimwa haionyeshi chochote.",legal_privacy_qr_title:"Msimbo wa QR",legal_privacy_qr_body:"Hauna data yoyote ya kibinafsi, ni funguo la nasibu lisiloweza kubashiriwa, linaloweza kubatilishwa wakati wowote.",legal_privacy_rights_title:"Haki zako",legal_privacy_rights_body:"Kurekebisha data zako, kuzima kadi yako au kufuta akaunti yako kutoka «Nafasi yangu». Mawasiliano: kupitia ukurasa wa Msaada.",legal_privacy_retention_title:"Uhifadhi",legal_privacy_retention_body:"Katika kipindi chote cha kadi yako, kisha kufutwa kwa ombi.",contact_h1:"Wasiliana nasi",contact_lead:"Una swali kuhusu kadi yako, malipo au akaunti yako? Tuandikie kwa barua pepe au WhatsApp: kwa kawaida tunajibu ndani ya masaa 24 hadi 48 ya kazi.",contact_email_title:"Kwa barua pepe",contact_email_desc:"Kwa swali lolote la kina au lenye kiambatisho.",contact_wa_title:"Kwa WhatsApp",contact_wa_desc:"Kwa jibu la haraka, Jumatatu hadi Jumamosi.",contact_write_title:"Tuandikie moja kwa moja",contact_subject_label:"Mada",contact_opt_payment:"Tatizo la malipo",contact_opt_card:"Tatizo la kadi",contact_opt_qr:"Tatizo la QR",contact_opt_data:"Mabadiliko ya data",contact_opt_account:"Kupoteza akaunti",contact_opt_refund:"Kurejeshewa fedha",contact_opt_technical:"Tatizo la kiufundi",contact_opt_other:"Nyingine",contact_phone_email_label:"Simu yako au barua pepe",contact_message_label:"Ujumbe",contact_send_btn:"Tuma",contact_footer_note:"Unaweza pia kuangalia <a href=\"#/aide\">ukurasa wetu wa msaada</a> au <a href=\"#/conditions\">masharti yetu ya matumizi</a>.",contact_err_missing:"Weka mawasiliano na ujumbe.",contact_sent_toast:"Ujumbe umetumwa. Tutakujibu hivi karibuni.",legal_terms_h1:"Masharti ya matumizi",legal_terms_notice:"Maandishi ya kazi yanayopaswa kuthibitishwa na wakili katika kila nchi ya uzinduzi kabla ya matumizi yoyote ya kibiashara.",legal_terms_s1_title:"1. Lengo",legal_terms_s1_body:"IFRIQI ni huduma binafsi, isiyo ya kitabibu na isiyo rasmi, inayoruhusu kutengeneza kadi ya kibinafsi ya utambulisho na dharura inayohusiana na msimbo wa QR. Kwa kutengeneza akaunti au kununua kadi, unakubali masharti haya.",legal_terms_s2_title:"2. Ambacho IFRIQI sio",legal_terms_s2_body:"IFRIQI si kitambulisho rasmi, wala rekodi ya kitabibu, wala huduma ya dharura, wala huduma ya uchunguzi. Taarifa zinazoonyeshwa baada ya kusoma zimetajwa na mmiliki au mwakilishi wake wa kisheria na hazibadilishi tathmini ya kitabibu.",legal_terms_s3_title:"3. Akaunti na usahihi wa taarifa",legal_terms_s3_body:"Wewe ndiye mwajibikaji wa usahihi wa taarifa zilizojazwa (utambulisho, mawasiliano, taarifa za afya) na wa kuzisasisha. Wasifu wa mtoto unaweza kutengenezwa tu na mzazi au mlezi wa kisheria.",legal_terms_s4_title:"4. Kadi na marekebisho",legal_terms_s4_body:"Kadi ya IFRIQI haina tarehe ya mwisho. Malipo yanajumuisha idadi ndogo ya marekebisho ya taarifa zako (4 kwa default). Zaidi ya hapo, kifurushi kipya cha marekebisho kinapaswa kununuliwa ili kuendelea kurekebisha wasifu wako; kadi inabaki hai na inafanya kazi wakati huo.",legal_terms_s5_title:"5. Malipo",legal_terms_s5_body:"Malipo yanafanyika kupitia Mobile Money, kadi ya benki, PayPal au njia nyingine yoyote inayotolewa kulingana na mtoa huduma anayepatikana nchini kwako. Kadi haiwashwi hadi mtoa huduma athibitishe malipo.",legal_terms_s6_title:"6. Sera ya kurejeshewa fedha",legal_terms_refund_1:"<b>Muda wa kujitoa.</b> Unaweza kuomba kurejeshewa fedha zote za kadi yako ndani ya siku 7 za kalenda baada ya ununuzi, mradi msimbo wa QR haujasomwa na kadi haijachapishwa na kutumika.",legal_terms_refund_2:"<b>Hitilafu ya malipo au kutozwa mara mbili.</b> Malipo yoyote ya mara mbili, kutozwa bila kutengenezwa kadi, au hitilafu ya kiufundi inayohusishwa na IFRIQI au mtoa huduma wake wa malipo inarejeshwa kikamilifu, bila muda wa kujitoa, baada ya uthibitisho.",legal_terms_refund_3:"<b>Baada ya muda wa siku 7.</b> Baada ya muda huu, au kama kadi imekwisha kutumika (kuchapishwa, kusomwa), kadi haitarejeshewa fedha tena, lakini inabaki kutumika bila kikomo cha muda.",legal_terms_refund_4:"<b>Vifurushi vya marekebisho.</b> Kifurushi cha marekebisho kisichotumika kinaweza kurejeshewa fedha ndani ya siku 7 baada ya ununuzi; kifurushi kilichotumika kwa sehemu hakirejeshwi.",legal_terms_refund_5:"<b>Jinsi ya kuomba kurejeshewa fedha.</b> Tuwasiliane kupitia ukurasa wa <a href=\"#/contact\">Mawasiliano</a> (barua pepe au WhatsApp) ukieleza kumbukumbu ya malipo yako. Fedha zinarejeshwa kwenye njia ile ile iliyotumika wakati wa ununuzi, ndani ya siku 5 hadi 10 za kazi kulingana na mtoa huduma.",legal_terms_refund_6:"<b>Kamisheni za mpango wa mapendekezo.</b> Kamisheni inayohusiana na oda iliyorejeshewa fedha inaghairiwa kulingana na masharti ya mpango wa mapendekezo.",legal_terms_s7_title:"7. Kuzima na kufuta",legal_terms_s7_body:"Unaweza kuzima kadi yako au kufuta akaunti yako wakati wowote kutoka «Nafasi yangu». Kufuta akaunti kunasababisha kufutwa kwa data zinazohusiana, kukizingatia wajibu wa kisheria wa uhifadhi.",legal_terms_s8_title:"8. Mpango wa mapendekezo",legal_terms_s8_body:"Kuwa wakala ni bure na si lazima. Kamisheni zinastahili tu kwa mauzo ya moja kwa moja, yaliyolipwa kweli, yaliyofanyika kupitia kiungo cha kibiashara cha wakala, kulingana na masharti yaliyoelezwa kwenye ukurasa wa «Pendekeza kadi».",legal_terms_s9_title:"9. Wajibu",legal_terms_s9_body:"IFRIQI inafanya kila jitihada kuhakikisha upatikanaji wa huduma, bila kuhakikisha utendaji usiokatizwa (mtandao, uhifadhi, mtoa huduma wa malipo). IFRIQI haiwezi kuwajibishwa kwa uamuzi wa kitabibu au wa dharura uliofanywa kwa msingi wa taarifa zilizoonyeshwa na mtu wa tatu.",legal_terms_s10_title:"10. Mabadiliko ya masharti",legal_terms_s10_body:"Masharti haya yanaweza kusasishwa; toleo linalotumika ni lile lililochapishwa kwenye ukurasa huu. Mawasiliano: <a href=\"#/contact\">ukurasa wa Mawasiliano</a>.",help_h1:"Msaada na mawasiliano",help_faq_title:"Maswali yanayoulizwa mara kwa mara",help_q1:"Je napaswa kuwa na programu ya kusoma msimbo?",help_a1:"Hapana. Kamera ya simu janja yoyote inatosha.",help_q2:"Nimepoteza kadi yangu.",help_a2:"Katika «Nafasi yangu», zima kadi au tengeneza msimbo mpya wa QR: ule wa zamani utaacha kufanya kazi. Vitendo hivi viwili havitumii marekebisho yoyote.",help_q3:"Je naweza kurekebisha taarifa zangu bila kuchapisha tena?",help_a3:"Ndiyo, isipokuwa picha, jina au mawasiliano yaliyochapishwa: katika hali hiyo, kadi mpya inapendekezwa.",help_q4:"Njia zipi za malipo?",help_a4:"Mobile Money, kadi ya benki, PayPal na njia nyingine, kulingana na mtoa huduma wa malipo anayepatikana nchini kwako.",help_q5:"Je kadi yangu inaisha muda?",help_a5:"Hapana. Malipo yanajumuisha marekebisho 4 ya taarifa zako. Baada ya kutumika, kadi inaendelea kufanya kazi; ili kurekebisha tena, unalipa kifurushi kipya cha marekebisho 4.",help_q6:"Je kadi inachukua nafasi ya kitambulisho changu?",help_a6:"Hapana, ni huduma binafsi ya ziada.",help_write_title:"Tuandikie",pwd_title:"Badilisha nenosiri langu",pwd_current_label:"Nenosiri la sasa",pwd_new_label:"Nenosiri jipya",pwd_new_placeholder:"Angalau herufi 6",pwd_confirm_label:"Thibitisha nenosiri jipya",pwd_save_btn:"Hifadhi",pwd_err_missing:"Jaza sehemu zote tatu.",pwd_err_wrong_current:"Nenosiri la sasa si sahihi.",pwd_err_too_short:"Nenosiri jipya linapaswa kuwa na angalau herufi 6.",pwd_err_mismatch:"Manenosiri mapya mawili hayalingani.",pwd_err_same:"Nenosiri jipya linapaswa kuwa tofauti na la zamani.",pwd_changed_toast:"Nenosiri limebadilishwa.",auth_err_pw_short:"Nenosiri linapaswa kuwa na angalau herufi 6.",auth_err_name:"Jaza jina lako la kwanza na la ukoo.",auth_err_country:"Chagua nchi yako.",auth_err_dial:"Chagua msimbo wa simu.",auth_err_phone:"Weka nambari sahihi ya simu (bila msimbo wa nchi).",auth_err_email:"Weka barua pepe sahihi.",auth_err_duplicate:"Simu au barua pepe hii inatumika tayari. Tumia «Ingia».",auth_err_id_required:"Weka simu yako au barua pepe.",auth_err_bad_login:"Kitambulisho au nenosiri si sahihi.",auth_err_suspended:"Akaunti hii imesimamishwa. Wasiliana na msaada.",auth_forgot_toast:"Onyesho: katika uzalishaji, msimbo wa OTP unatumwa kwa SMS au barua pepe.",g_no_data:"Hakuna data kwa sasa."}

function drawFlagBadge(c,x,y,w,h,code){
  c.save();rrect(c,x,y,w,h,2);c.clip();
  const f=FLAGDEF[String(code).toUpperCase()];
  if(!f){c.fillStyle='#8B9CC0';c.fillRect(x,y,w,h)}
  else if(f.dir==='v'){const n=f.bands.length,bw=w/n;f.bands.forEach((col,i)=>{c.fillStyle=col;c.fillRect(x+i*bw,y,bw+.6,h)})}
  else if(f.dir==='h2v'){c.fillStyle=f.left;c.fillRect(x,y,w/3,h);const bh=h/2;f.bands.forEach((col,i)=>{c.fillStyle=col;c.fillRect(x+w/3,y+i*bh,w*2/3,bh+.6)})}
  else if(f.dir==='diag'){c.fillStyle=f.a;c.fillRect(x,y,w,h);c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y);c.lineTo(x,y+h);c.closePath();c.fillStyle=f.b;c.fill();if(f.mid){c.save();c.beginPath();c.moveTo(x,y+h*.42);c.lineTo(x+w,y+h*.58);c.lineTo(x+w,y+h*.42);c.closePath();c.fillStyle=f.mid;c.fill();c.restore()}}
  else if(f.dir==='diag5'){const n=f.cols.length,bw=w/n;f.cols.forEach((col,i)=>{c.fillStyle=col;c.fillRect(x+i*bw,y,bw+.6,h)})}
  else{ // horizontal bands, optionally weighted
   const ws=f.w||f.bands.map(()=>1),tot=ws.reduce((a,b)=>a+b,0);let yy=y;
   f.bands.forEach((col,i)=>{const bh=h*ws[i]/tot;c.fillStyle=col;c.fillRect(x,yy,w,bh+.6);yy+=bh})
  }
  if(f&&f.triangle){c.beginPath();c.moveTo(x,y);c.lineTo(x,y+h);c.lineTo(x+w*.42,y+h/2);c.closePath();c.fillStyle=f.triangle;c.fill()}
  if(f&&f.canton){c.fillStyle=f.canton;c.fillRect(x,y,w*.4,h*.5)}
  if(f&&f.circle){const cx=x+w*f.circle.pos,cy=y+h/2,r=h*.22;c.beginPath();c.arc(cx,cy,r,0,7);c.fillStyle=f.circle.color;c.fill()}
  if(f&&f.star){const cx=x+(f.star.onLeft?w*.17:w*f.star.pos),cy=y+h/2,r=h*.2;c.save();c.translate(cx,cy);c.fillStyle=f.star.color;c.beginPath();
   for(let i=0;i<5;i++){const a1=-Math.PI/2+i*2*Math.PI/5,a2=a1+Math.PI/5;c.lineTo(Math.cos(a1)*r,Math.sin(a1)*r);c.lineTo(Math.cos(a2)*r*.42,Math.sin(a2)*r*.42)}
   c.closePath();c.fill();c.restore()}
  c.restore();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1;rrect(c,x+.5,y+.5,w-1,h-1,2);c.stroke();
}

function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function blurText(c,t,x,y,font,color,align){c.font=font;const w=Math.ceil(c.measureText(t).width)+24,fs=+(/(\d+(?:\.\d+)?)px/.exec(font)||[0,16])[1],h=Math.ceil(fs*2),k=7;
  const o=document.createElement('canvas');o.width=Math.ceil(w/k);o.height=Math.ceil(h/k);const oc=o.getContext('2d');oc.scale(1/k,1/k);oc.font=font;oc.fillStyle=color;oc.textBaseline='middle';oc.fillText(t,12,h/2);
  const x0=align==='right'?x-w+12:x-12;c.save();c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(o,x0,y-h/2,o.width*k,o.height*k);c.restore()}
function txt(c,s,x,y,font,color,o){o=o||{};c.font=font;c.fillStyle=color;c.textBaseline='middle';c.textAlign=o.align||'left';let t=String(s);
  if(o.max){while(c.measureText(t).width>o.max&&t.length>1)t=t.slice(0,-1);if(t!==String(s))t=t.trimEnd()+'…'}
  if(o.blur){blurText(c,t,x,y,font,color,o.align);c.textAlign='left'}else c.fillText(t,x,y);const w=c.measureText(t).width;c.textAlign='left';return w}
function wrap(c,text,font,maxW,maxLines){c.font=font;const words=String(text).split(/\s+/),lines=[];let cur='';

/* Les gabarits de la carte ont été calibrés pour le français ; une traduction peut être plus
   longue (le portugais et l'espagnol notamment) et déborder des zones fixes (bouton, bandeau).
   fitSize() réduit la taille de police jusqu'à ce que le texte tienne dans la largeur donnée,
   pour ne jamais faire déborder ni couper un mot hors de la carte imprimée. */
function fitSize(c,text,weight,family,maxSize,minSize,maxW){
  let fs=maxSize;c.font=weight+' '+fs+'px '+family;
  while(c.measureText(text).width>maxW&&fs>minSize){fs--;c.font=weight+' '+fs+'px '+family}
  return fs}
/* Même principe que fitSize(), mais pour un bloc de texte tenant sur plusieurs lignes (le bouton
   « scanner » par ex.) : réduit la police jusqu'à ce que le texte tienne en maxLines lignes de
   largeur maxW au maximum. */
function fitWrap(c,text,weight,family,maxSize,minSize,maxW,maxLines){
  let fs=maxSize,lines;
  for(;fs>=minSize;fs--){c.font=weight+' '+fs+'px '+family;lines=wrap(c,text,c.font,maxW,maxLines);
    if(lines.length<=maxLines&&lines.every(l=>c.measureText(l).width<=maxW))break}
  return {fs,lines}}

  ${reg?'':`<button class="btn sec" onclick="toast(t('auth_forgot_toast'))">${t('auth_forgot')}</button>`}</div>

async function doAuth(){
  const pw=$('#a_pw').value,e=$('#err'),reg=authMode==='register';
  const bad=m=>{e.innerHTML=`<div class="err" role="alert">${m}</div>`};
  if(pw.length<6)return bad(t('auth_err_pw_short'));
  const hash=await sha('ifriki:'+pw);
  if(reg){
    const first=$('#r_first').value.trim(),last=$('#r_last').value.trim(),email=$('#r_email').value.trim().toLowerCase(),cs=AFRICA.find(x=>x[0]===regSel.c),ds=AFRICA.find(x=>x[0]===regSel.dc);
    const local=$('#r_phone').value.replace(/\D/g,'').replace(/^0+/,''),phone=ds?'+'+ds[2]+local:'',country=cs?cs[1]:'',countryCode=cs?cs[0]:'';
    if(!first||!last)return bad(t('auth_err_name'));
    if(!cs)return bad(t('auth_err_country'));
    if(!ds)return bad(t('auth_err_dial'));
    if(local.length<6||phone.replace(/\D/g,'').length>15)return bad(t('auth_err_phone'));
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return bad(t('auth_err_email'));
    if(db.users.some(u=>u.ident===phone||(u.email&&u.email===email)))return bad(t('auth_err_duplicate'));
    const u={id:'U'+uid(),ident:phone,phone,email,first,last,country,countryCode,pw:hash,role:'user',status:'active',createdAt:Date.now()};
    db.users.push(u);db.session=u.id;audit(u.id,'register','user');save();go('/app');
  }else{
    const id=$('#a_id').value.trim().toLowerCase().replace(/\s+/g,'');
    if(!id)return bad(t('auth_err_id_required'));
    const u=db.users.find(x=>(x.ident===id||(x.email&&x.email===id))&&x.pw===hash);
    if(!u)return bad(t('auth_err_bad_login'));
    if(u.status==='suspended')return bad(t('auth_err_suspended'));
    db.session=u.id;audit(u.id,'login','user');save();go('/app');
  }
}

/* ---------- Génération du PDF (sans bibliothèque PDF : écriture directe du fichier) ---------- */
function buildPdf(images,pages){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0,n=2;
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length};
  const pt=v=>(v*72/25.4).toFixed(2);
  const imgIds=images.map(()=>++n),plan=pages.map(()=>({page:++n,content:++n}));
  put('%PDF-1.4\n');
  const obj=(id,fn)=>{offs[id]=len;put(id+' 0 obj\n');fn();put('\nendobj\n')};
  obj(1,()=>put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>put('<< /Type /Pages /Kids ['+plan.map(q=>q.page+' 0 R').join(' ')+'] /Count '+pages.length+' >>'));
  images.forEach((im,i)=>obj(imgIds[i],()=>{put('<< /Type /XObject /Subtype /Image /Width '+im.pw+' /Height '+im.ph+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n');put(im.bytes);put('\nendstream')}));
  pages.forEach((pg,i)=>{
    const q=plan[i];let cs='';
    pg.draws.forEach(d=>{cs+='q '+pt(d.w)+' 0 0 '+pt(d.h)+' '+pt(d.x)+' '+pt(pg.h-d.y-d.h)+' cm /Im'+d.img+' Do Q\n'});
    if(pg.rects&&pg.rects.length){cs+='q 0.5 w [3 3] 0 d 0.45 0.45 0.45 RG\n';pg.rects.forEach(r=>{cs+=pt(r.x)+' '+pt(pg.h-r.y-r.h)+' '+pt(r.w)+' '+pt(r.h)+' re S\n'});cs+='Q\n'}
    const xo=images.map((_,k)=>'/Im'+k+' '+imgIds[k]+' 0 R').join(' ');
    obj(q.page,()=>put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pt(pg.w)+' '+pt(pg.h)+'] /Resources << /XObject << '+xo+' >> >> /Contents '+q.content+' 0 R >>'));
    obj(q.content,()=>put('<< /Length '+cs.length+' >>\nstream\n'+cs+'endstream'));
  });
  const xref=len,total=n+1;let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  put(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}
async function downloadPdf(id,mode){
  const p=getP(id);if(!p||!p.card)return;
  openModal('<div style="text-align:center"><div class="spin"></div><h3>'+t('card_pdf_creating_title')+'</h3><p class="muted small">'+t('card_pdf_creating_desc')+'</p></div>');
  try{
    await ready();if(p.photo&&!IMGS[p.photo])await loadImg(p.photo);
    const url=scanUrl(p.card.token),images=[];
    for(const side of ['recto','verso']){
      const cv=cardCanvas(p,side,url,2);
      const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',.97));if(!blob)throw new Error('encodage');
      images.push({bytes:new Uint8Array(await blob.arrayBuffer()),pw:cv.width,ph:cv.height});
    }
    const CW=85.6,CH=53.98;let pages;
    if(mode==='a4'){const x0=(210-(CW*2+6))/2,draws=[],rects=[];
      for(let i=0;i<4;i++){const y=20+i*(CH+8);draws.push({img:0,x:x0,y,w:CW,h:CH},{img:1,x:x0+CW+6,y,w:CW,h:CH});rects.push({x:x0,y,w:CW,h:CH},{x:x0+CW+6,y,w:CW,h:CH})}
      pages=[{w:210,h:297,draws,rects}]}
    else pages=[{w:CW,h:CH,draws:[{img:0,x:0,y:0,w:CW,h:CH}]},{w:CW,h:CH,draws:[{img:1,x:0,y:0,w:CW,h:CH}]}];
    const pdf=buildPdf(images,pages),name='ifriqi-'+(mode==='a4'?'planche-A4-':'carte-')+p.card.publicId+'.pdf';
    const dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
    closeModal();
    if(dl){await dl.save({filename:name,data:pdf});toast(t('card_pdf_saved'))}

function mkCommission(distId,orderId,level,amountFcfa,desc){
  // Idempotence stricte : une (commande, niveau) ne crée jamais plus d'une commission, même en cas de double appel/double webhook simulé.
  if(db.commissions.some(c=>c.orderId===orderId&&c.level===level))return null;
  const d=distById(distId);if(!d||d.status==='SUSPENDED'||d.status==='DEACTIVATED')return null;
