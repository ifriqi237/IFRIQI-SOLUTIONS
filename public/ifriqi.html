  const c={id:'C'+uid(),distId:d.id,orderId,level,amount:amountFcfa,currency:cur,rateUsed:rate,status:'PENDING',createdAt:Date.now()};
  db.commissions.push(c);ledger(d.id,'COMMISSION',c.amount,orderId,(level===1?tf('dist_ledger_desc_l1',{AMOUNT:money(c.amount)}):tf('dist_ledger_desc_l2',{AMOUNT:money(c.amount)}))+(desc?(' · '+desc):''));
  notify(d.id,level===1?t('dist_notif_sale_title'):t('dist_notif_referral_title'),level===1?tf('dist_notif_sale_text',{AMOUNT:money(c.amount)}):tf('dist_notif_referral_text',{AMOUNT:money(c.amount)}));

function createCommission(o){

  if(!o.distId||o.paymentStatus!=='PAID'||o.product!=='card')return null;
  const d=db.distributors.find(x=>x.id===o.distId);if(!d)return null;
  const cu=userOf(o.customerId),du=userOf(d.userId);
  if(sameIdentity(cu,du)){o.note=t('dist_note_personal');return null}
  if(d.status==='SUSPENDED'||d.status==='DEACTIVATED'){o.note=t('dist_note_inactive');return null}
  // Niveau 1 : le distributeur dont le lien a généré la vente.
  const c1=mkCommission(d.id,o.id,1,db.settings.commL1,orderShort(o));
  // Niveau 2 : SEULEMENT le parrain direct de ce distributeur (jamais plus haut -> pas de niveau 3).
  if(d.referredBy){
    const r=distById(d.referredBy);
    if(r&&r.status==='ACTIVE'&&!sameIdentity(cu,userOf(r.userId))&&r.id!==d.id){
      mkCommission(r.id,o.id,2,db.settings.commL2,orderShort(o));

function copyText(txt){const done=()=>toast(t('dist_link_copied'));
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fb());return}}catch(e){}fb();
  function fb(){const a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast(t('dist_copy_manual'))}a.remove()}}

function updShare(){const m=$('#sh_msg').value,d=myDist();$('#sh_wa').href='https://wa.me/?text='+encodeURIComponent(m);$('#sh_fb').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(distLink(d))+'&quote='+encodeURIComponent(m);$('#sh_sms').href='sms:?&body='+encodeURIComponent(m)}
function nativeShare(){navigator.share({title:'IFRIQI',text:$('#sh_msg').value}).catch(()=>{})}
function qrDataUrl(link,size){const cv=document.createElement('canvas');cv.width=cv.height=size;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,size,size);
  if(typeof qrcode==='undefined'){c.fillStyle='#000';c.font='16px sans-serif';c.fillText(t('g_qr_unavailable'),10,30);return cv.toDataURL('image/png')}
  const q=qrcode(0,'M');q.addData(link);q.make();const n=q.getModuleCount(),m=Math.round(size*.06),k=(size-2*m)/n;c.fillStyle='#000';
  for(let r=0;r<n;r++)for(let j=0;j<n;j++)if(q.isDark(r,j))c.fillRect(m+j*k,m+r*k,k+.4,k+.4);return cv.toDataURL('image/png')}
async function saveBlob(blob,name){const dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
  if(dl){try{await dl.save({filename:name,data:blob});toast(t('g_file_saved'))}catch(e){if(!(e&&e.code==='declined'))toast(t('g_download_failed'))}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast(t('g_file_generated'))}}
async function downloadQR(){const d=myDist();await ready();
  const W=900,H=1120,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,H);
  const lg=IMGS[LOGO_URI];if(lg){const h=130,w=h*lg.width/lg.height;c.drawImage(lg,(W-w)/2,40,w,h)}
  c.textAlign='center';c.fillStyle='#012768';c.font='800 44px '+FH;c.fillText(t('dist_qr_canvas_title'),W/2,236);
  const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=qrDataUrl(distLink(d),760)});c.drawImage(img,70,280,760,760);
  c.font='600 34px '+FF;c.fillStyle='#012768';c.fillText(t('dist_qr_canvas_subtitle'),W/2,1082);
  cv.toBlob(b=>saveBlob(b,'ifriqi-qr-'+d.code+'.png'),'image/png')}

function pwdModal(){openModal(`<h3>${t('pwd_title')}</h3><div id="cp_err"></div>
  <label class="f">${t('pwd_current_label')}<input id="cp_old" type="password" autocomplete="current-password"></label>
  <label class="f">${t('pwd_new_label')}<input id="cp_new" type="password" autocomplete="new-password" placeholder="${t('pwd_new_placeholder')}"></label>
  <label class="f">${t('pwd_confirm_label')}<input id="cp_new2" type="password" autocomplete="new-password"></label>
  <div class="row"><button class="btn amber" onclick="changePwd()">${t('pwd_save_btn')}</button><button class="btn sec" onclick="closeModal()">${t('g_cancel')}</button></div>`)}
async function changePwd(){const u=me(),bad=m=>{$('#cp_err').innerHTML=`<div class="err" role="alert">${m}</div>`};
  const o=$('#cp_old').value,n=$('#cp_new').value,n2=$('#cp_new2').value;
  if(!o||!n||!n2)return bad(t('pwd_err_missing'));
  if((await sha('ifriki:'+o))!==u.pw)return bad(t('pwd_err_wrong_current'));
  if(n.length<6)return bad(t('pwd_err_too_short'));
  if(n!==n2)return bad(t('pwd_err_mismatch'));
  if(n===o)return bad(t('pwd_err_same'));
  u.pw=await sha('ifriki:'+n);audit(u.id,'password_changed','user');save();closeModal();toast(t('pwd_changed_toast'))}
function toggleDD(e){e.stopPropagation();const m=$('#ddm');if(!m)return;const o=m.classList.toggle('open');$('#ddb').setAttribute('aria-expanded',o);m.style.left='';m.style.right='0';
  if(o){const r=m.getBoundingClientRect();if(r.left<8){m.style.right='auto';m.style.left='0'}}}
document.addEventListener('click',()=>{const m=$('#ddm');if(m)m.classList.remove('open');pkClose();closeLangMenu()});
